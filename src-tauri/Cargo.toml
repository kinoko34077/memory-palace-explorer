[package]
name = "memory-palace-explorer"
version = "0.1.0"
description = "A spatial local file explorer"
authors = ["KiNoTch."]
edition = "2021"

[lib]
name = "memory_palace_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
